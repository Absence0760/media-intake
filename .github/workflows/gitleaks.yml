name: gitleaks

# Secret-scan every push to main and every PR. The weekly full-history sweep
# calls this workflow from gitleaks-sweep.yml, which also opens a
# `secret-scan` issue when the sweep fails (a failed scheduled run otherwise
# reaches nobody) and closes it on the next clean sweep.
#
# This project keeps no secrets at all; the scan catches a stray paste.
# CodeQL (security.yml) finds source-level bugs and osv-scanner
# (supply-chain-scan.yml) dependency CVEs; neither looks for secrets.
#
# False positives go in `.gitleaks.toml`, scoped to the matched value rather
# than the file, so a genuine key in the same file still fails.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by gitleaks-sweep.yml for the weekly full-history scan.
  workflow_call:

permissions: read-all

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The action POSTs SARIF findings via the same security-events
      # permission CodeQL uses — keeps the Security tab the single
      # pane of glass.
      security-events: write
      # PR metadata for inline annotations.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `fetch-depth: 0` is required for the full-history scan
          # on the scheduled run. Push/PR triggers ignore the depth
          # because they have access to the base ref via the
          # workflow event itself.
          fetch-depth: 0
          # The action reads GITHUB_TOKEN from its env; git never needs it.
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is intentionally unset — public-repo free
          # tier covers everything we need.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
